<!doctype html>
<meta charset="utf-8">
<title>Emergence</title>
<style>body{margin:0;background:#111;color:#ddd;font:14px sans-serif}canvas{display:block;position:fixed;inset:0;z-index:0}#hud{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;line-height:1.3;max-width:96vw}#hud:empty{display:none}
#hud .hint{background:#3a2a10ee;color:#ffcb7a;border:1px solid #a8752a;padding:3px 10px;border-radius:4px}
#hud .actions{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
#hud .act{background:#000b;border:1px solid #555;border-radius:4px;padding:2px 7px 2px 3px;color:#fff;white-space:nowrap}
#hud .act kbd{display:inline-block;min-width:16px;text-align:center;background:#eee;color:#111;border-radius:3px;padding:0 3px;margin-right:5px;font:bold 12px monospace}
#hud .act i{font-size:10px;color:#9ab;margin-left:5px;font-style:normal;text-transform:uppercase}
#hud .act.off{opacity:.38;border-color:#333}
#hud .act.off kbd{background:#777}
#hud .main{display:flex;gap:8px;align-items:stretch;background:#000b;padding:6px;border-radius:6px;border:1px solid #333}
#hud .card{min-width:150px;padding:4px 8px;background:#1a1a1a;border-radius:4px;display:flex;flex-direction:column;justify-content:center;gap:3px}
#hud .card .who{font-weight:bold}#hud .card .who .age{font-weight:normal;color:#9ab;font-size:12px;margin-left:4px}
#hud .card.food.low{outline:1px solid #d9a13a}#hud .card.food.critical{outline:1px solid #e0463a;animation:pulse 1s infinite}
#hud .card.fire{flex-direction:row;align-items:center;gap:8px;min-width:120px}#hud .card.fire img{width:30px;height:35px}
#hud .card.dead{color:#e0463a;font-weight:bold}
@keyframes pulse{50%{background:#3a1a1a}}
#hud .bar{height:6px;background:#333;border-radius:3px;overflow:hidden;min-width:100px}#hud .bar div{height:100%;background:#7bc850}
#hud .bar.low div{background:#d9a13a}#hud .bar.critical div{background:#e0463a}#hud .bar.burn div{background:#ff7a1a}#hud .bar.build div{background:#8a7a6a}
#hud .slots{display:flex;gap:4px}
#hud .slot{position:relative;width:56px;height:60px;background:#1f1f1f;border:1px solid #555;border-radius:4px;display:flex;align-items:center;justify-content:center}
#hud .slot.work{border-color:#c9a26a}#hud .slot.empty{border:1px dashed #333;background:#141414}
#hud .slot img{width:34px;height:34px;image-rendering:pixelated;margin-bottom:8px}
#hud .slot .count{position:absolute;right:3px;top:1px;font-weight:bold;font-size:14px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
#hud .slot .cap{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:9px;color:#aaa;white-space:nowrap;overflow:hidden}
#hud .pbar{position:absolute;left:4px;right:4px;bottom:14px;height:4px;background:#000;border-radius:2px;overflow:hidden}#hud .pbar div{height:100%;background:#c9a26a}#hud .pbar.raw_meat div{background:#d04a4a}
#ui{position:relative;z-index:1;padding:4px 6px;background:#000a;display:inline-block}</style>
<div id="ui"><button id="speed">Speed x1</button> <button id="replay">Replay</button> <button id="mode"></button> <button id="follow">Follow: on</button> <span id="info"></span> <span id="status"></span>
<div>WASD/arrows move (Shift sneaks; with no character they pan the camera, Shift = faster) · IJKL look · wheel/+/- zoom · drag pans · F follow · V reveal all (then click a creature) · the row of keys at the bottom shows what you can do right now</div></div>
<div id="hud"></div>
<canvas id="c"></canvas>
<script type="module" src="main.js"></script>
